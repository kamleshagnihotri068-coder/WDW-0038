<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
   <legend>Personal Details</legend> 

   <p>Name: <input type="text" name="name" required></p>
   <p>Email: <input type="email" name="email" required></p>
   <p>Password:<input type="Password" name="password" required></p>
         
   <p>Gender:<input type="radio" name="gender" value="male"><label for="m">male</label>
         <input type="radio" id="f" name="gender" value="female"><label for="f">Female</label></p>
   
<p>Hobbies: <input type="checkbox" id="r" name="Hobby" value="Reading"><label for="r">Reading</label>
<input type="checkbox" id="c" name="Hobby" value="Coding"><label for="c">Coding</label></p>
   <p>DOB: <input type="date" name="dob" required></p>
   </fieldset>
   </form>
</body>
</html>
